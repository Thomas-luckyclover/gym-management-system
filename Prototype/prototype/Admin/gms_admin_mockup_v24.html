<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GMS Admin — Mockup v24 (Montserrat + Work Sans)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@600;700;800&family=Montserrat:wght@600;700;800&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --admin:#5B3FA0; --admin-hover:#4A3287; --admin-bg:#F1ECFB; --admin-border:#D8CCF0;
  --manager:#3B4FA0; --staff:#0E8E82; --staff-bg:#E7F6F3; --customer:#E2583E; --customer-bg:#FDEDEB;
  --page:#FAFAF8; --card:#FFFFFF; --text:#23221F; --text2:#6B6960; --border:#E7E5DF;
  --success:#2F8F5B; --warning:#D69E2E; --danger:#D32F3F; --info:#2E6FBA;
  --success-bg:#E8F4EC; --warning-bg:#FBF3E2; --danger-bg:#FBE9EA; --info-bg:#E8F0F9;
  --r-sm:6px; --r-md:10px; --r-lg:14px;
  --font:"Work Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --display:"Montserrat", "Segoe UI", system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);font-size:14px;line-height:1.5;color:var(--text);background:var(--page);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--admin)}
:focus-visible{outline:2px solid var(--admin);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- App shell ---------- */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.sidebar{background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:20px 20px 18px}
.brand-mark{width:32px;height:32px;border-radius:8px;background:var(--admin);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.02em}
.brand-name{font-weight:700;font-size:15px}
.brand-role{font-size:12px;color:var(--admin);font-weight:600}
.nav{padding:8px 12px;display:flex;flex-direction:column;gap:2px;flex:1}
.nav-group{font-size:12px;color:var(--text2);padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-sm);color:var(--text);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--page)}
.nav a.active{background:var(--admin-bg);color:var(--admin);font-weight:600;box-shadow:inset 3px 0 0 var(--admin)}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.side-foot{border-top:1px solid var(--border);padding:12px}
.me{display:flex;align-items:center;gap:10px;padding:8px;border-radius:var(--r-sm);text-decoration:none;color:var(--text)}
.me:hover{background:var(--page)}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:12px;flex:none;background:var(--admin-bg);color:var(--admin)}
.me small{display:block;color:var(--text2);font-size:12px}
.logout{margin-top:4px;width:100%;text-align:left;background:none;border:0;padding:8px;border-radius:var(--r-sm);color:var(--text2);cursor:pointer}
.logout:hover{background:var(--page);color:var(--text)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 32px;border-bottom:1px solid var(--border);background:var(--card)}
.crumbs{font-size:13px;color:var(--text2)}
.crumbs a{color:var(--text2);text-decoration:none}
.crumbs a:hover{color:var(--admin)}
.crumbs b{color:var(--text);font-weight:600}
.spec-toggle{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2);cursor:pointer;user-select:none}
.spec-toggle input{accent-color:var(--admin)}
.content{padding:28px 32px 64px;max-width:1240px;width:100%}

/* spec tags (screen code / layout / UC / message) */
.spec{display:inline-flex;gap:6px;align-items:center;font-size:11px;font-weight:600;color:var(--admin);background:var(--admin-bg);border:1px dashed var(--admin-border);border-radius:4px;padding:1px 6px;vertical-align:middle;white-space:nowrap}
body.no-spec .spec{display:none}

/* ---------- Page header ---------- */
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-head h1{font-size:24px;line-height:1.25;font-weight:700;margin:0 0 4px;letter-spacing:-.01em}
.page-head p{margin:0;color:var(--text2);max-width:64ch}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--card);padding:8px 14px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--text);transition:background .12s,border-color .12s}
.btn:hover{background:var(--page);border-color:#D4D1C8}
.btn-primary{background:var(--admin);border-color:var(--admin);color:#fff}
.btn-primary:hover{background:var(--admin-hover);border-color:var(--admin-hover)}
.btn-danger{color:var(--danger);border-color:#EFC5C9}
.btn-danger:hover{background:var(--danger-bg);border-color:var(--danger)}
.btn-danger-solid{background:var(--danger);border-color:var(--danger);color:#fff}
.btn-danger-solid:hover{background:#B72633}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}

/* ---------- Card ---------- */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md)}
.card-pad{padding:20px}
.card h2{font-size:16px;margin:0 0 4px;font-weight:600}
.card .sub{color:var(--text2);font-size:13px;margin:0 0 16px}

/* ---------- Filters ---------- */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border)}
.field-inline{display:flex;flex-direction:column;gap:4px}
.field-inline label{font-size:12px;color:var(--text2)}
.input,.select,textarea.input{border:1px solid var(--border);background:var(--card);border-radius:var(--r-sm);padding:8px 10px;min-height:36px}
.input:focus,.select:focus{outline:none;border-color:var(--admin);box-shadow:0 0 0 3px var(--admin-bg)}
.input[readonly]{background:var(--page);color:var(--text)}
.select:disabled,.input:disabled{background:var(--page);color:var(--text2);cursor:not-allowed}
.search{position:relative;flex:1;min-width:220px}
.search input{width:100%;padding-left:34px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--text2);fill:none;stroke-width:2}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:7px 12px;cursor:pointer;font-weight:500;color:var(--text2);border-right:1px solid var(--border)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--admin-bg);color:var(--admin);font-weight:600}

/* ---------- Table ---------- */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;font-weight:600;color:var(--text2);padding:10px 16px;border-bottom:1px solid var(--border);background:#FCFCFA;white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover{background:#FBFAFD}
tbody tr:last-child td{border-bottom:0}
.who{display:flex;align-items:center;gap:10px}
.who b{font-weight:600;display:block}
.who small{color:var(--text2);font-size:12px}
.num{font-variant-numeric:tabular-nums}

/* role & status */
.role{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px}
.role-Admin{background:var(--admin-bg);color:var(--admin)}
.role-Manager{background:#EDEFFA;color:var(--manager)}
.role-PT,.role-LeTan{background:var(--staff-bg);color:#0B766C}
.role-Khach{background:var(--customer-bg);color:#C6472F}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.st-active{color:var(--success)}
.st-locked{color:var(--danger)}
.st-temp{color:#A87712}
.st-inactive{color:var(--text2)}

.table-foot{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-top:1px solid var(--border);color:var(--text2);font-size:13px;flex-wrap:wrap;gap:10px}
.pager{display:flex;gap:4px}
.pager button{min-width:32px;height:32px;border:1px solid var(--border);background:var(--card);border-radius:var(--r-sm);cursor:pointer}
.pager button[aria-current="page"]{background:var(--admin);border-color:var(--admin);color:#fff;font-weight:600}
.empty{padding:48px 16px;text-align:center;color:var(--text2)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--admin);border-color:var(--admin)}
.tabs .count{font-size:12px;background:var(--page);border:1px solid var(--border);padding:0 6px;border-radius:999px;margin-left:6px;color:var(--text2)}
.tabs button[aria-selected="true"] .count{background:var(--admin-bg);border-color:var(--admin-border);color:var(--admin)}

/* ---------- Detail (L2) ---------- */
.detail{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.f{display:flex;flex-direction:column;gap:6px}
.f.full{grid-column:1/-1}
.f label{font-size:13px;font-weight:600}
.f label .req{color:var(--danger);margin-left:2px}
.f .hint{font-size:12px;color:var(--text2)}
.f .err{font-size:12px;color:var(--danger);display:none}
.f.invalid .input{border-color:var(--danger)}
.f.invalid .err{display:block}
.form-actions{display:flex;gap:10px;justify-content:flex-end;padding:16px 20px;border-top:1px solid var(--border);background:#FCFCFA;border-radius:0 0 var(--r-md) var(--r-md)}
.detail-head{display:flex;align-items:center;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.detail-head .avatar{width:52px;height:52px;font-size:17px}
.detail-head h1{font-size:22px;margin:0 0 4px;font-weight:700}
.detail-head .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--text2);font-size:13px}
.detail-head .grow{flex:1}

.side-card{padding:18px}
.side-card h3{font-size:14px;margin:0 0 12px;font-weight:600}
.side-card + .side-card{margin-top:16px}
.act-list{display:flex;flex-direction:column;gap:8px}
.act-list .btn{justify-content:flex-start;width:100%}
.act-note{font-size:12px;color:var(--text2);margin:10px 0 0}
.tip-wrap{position:relative}
.tip{display:none;position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--text);color:#fff;font-size:12px;line-height:1.45;padding:9px 11px;border-radius:var(--r-sm);z-index:5}
.tip-wrap:hover .tip,.tip-wrap:focus-within .tip{display:block}

.banner{display:flex;gap:12px;padding:12px 14px;border-radius:var(--r-sm);border:1px solid;margin-bottom:16px;font-size:13px;align-items:flex-start}
.banner svg{width:18px;height:18px;flex:none;margin-top:1px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.banner b{display:block;margin-bottom:2px}
.b-warn{background:var(--warning-bg);border-color:#EDD39C;color:#7A5A12}
.b-info{background:var(--info-bg);border-color:#BFD3EC;color:#234F87}
.b-muted{background:var(--page);border-color:var(--border);color:var(--text2)}
.b-admin{background:var(--admin-bg);border-color:var(--admin-border);color:#44307A}

.lockbox{border:1px solid #EDD39C;background:var(--warning-bg);border-radius:var(--r-md);padding:16px;margin-bottom:16px}
.lockbox .t{font-size:13px;color:#7A5A12;margin:0 0 2px}
.lockbox .clock{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;color:#5C430C;margin:4px 0 2px;letter-spacing:-.01em}
.lockbox .s{font-size:12px;color:#7A5A12;margin:0 0 12px}

.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin:0}
.kv dt{color:var(--text2)}
.kv dd{margin:0;font-weight:500}

.mini-log{list-style:none;margin:0;padding:0;font-size:13px}
.mini-log li{padding:10px 0;border-bottom:1px solid var(--border)}
.mini-log li:last-child{border-bottom:0}
.mini-log time{display:block;font-size:12px;color:var(--text2)}

/* ---------- Audit log (the signature piece) ---------- */
.ledger-day{padding:10px 20px;font-size:13px;font-weight:600;color:var(--text2);background:#FCFCFA;border-bottom:1px solid var(--border);border-top:1px solid var(--border);position:sticky;top:0}
.ledger-day:first-child{border-top:0}
.entry{display:grid;grid-template-columns:64px 1fr;gap:16px;padding:16px 20px;border-bottom:1px solid var(--border)}
.entry:last-child{border-bottom:0}
.entry time{font-variant-numeric:tabular-nums;font-weight:600;color:var(--text);font-size:14px;padding-top:1px}
.sentence{font-size:15px;line-height:1.7;max-width:78ch}
.sentence .actor{font-weight:600}
.sentence .actor .r{font-weight:500;color:var(--text2)}
.sentence .obj{font-weight:600}
.v-old{background:var(--danger-bg);color:#9E2330;text-decoration:line-through;text-decoration-thickness:1px;padding:1px 6px;border-radius:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.v-new{background:var(--success-bg);color:#1F6B42;padding:1px 6px;border-radius:4px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.why{margin-top:4px;font-size:13px;color:var(--text2)}
.why b{color:var(--text);font-weight:500}
.kind{display:inline-block;font-size:11px;font-weight:600;color:var(--text2);border:1px solid var(--border);border-radius:4px;padding:0 6px;margin-left:6px;vertical-align:2px}
.readonly-note{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text2)}
.readonly-note svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}

/* ---------- Report ---------- */
.stamp{font-size:13px;color:var(--text2)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{padding:16px 18px}
.stat .l{font-size:13px;color:var(--text2)}
.stat .v{font-size:28px;font-weight:700;line-height:1.2;margin:4px 0 2px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat .d{font-size:12px;color:var(--text2)}
.stat .d .up{color:var(--success);font-weight:600}
.stat .d .down{color:var(--danger);font-weight:600}
.two{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin-bottom:16px}
.chart svg{width:100%;height:auto;display:block}
.bars{display:flex;flex-direction:column;gap:12px}
.bar-row{display:grid;grid-template-columns:130px 1fr 40px;gap:10px;align-items:center;font-size:13px}
.bar-track{height:8px;background:var(--page);border-radius:4px;overflow:hidden;border:1px solid var(--border)}
.bar-fill{height:100%;border-radius:4px}
.audit-block{border:1px solid var(--admin-border);border-radius:var(--r-lg);background:linear-gradient(var(--admin-bg),var(--admin-bg)) top/100% 64px no-repeat,var(--card);overflow:hidden}
.audit-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;flex-wrap:wrap}
.audit-head h2{font-size:17px;margin:0;color:#3F2B75}
.audit-head p{margin:2px 0 0;font-size:13px;color:#5E4C8F}
.audit-body{padding:4px 20px 20px}
.audit-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:12px 0 18px}
.audit-stats .stat{border:1px solid var(--border);border-radius:var(--r-md);background:var(--card)}
.error-inline{display:none;color:var(--danger);font-size:12px;margin-top:6px}
.range-bad .error-inline{display:block}
.range-bad .input{border-color:var(--danger)}

/* ---------- Auth (L4) ---------- */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--page)}
.auth-card{width:100%;max-width:400px;padding:32px}
.auth-card h1{font-size:22px;margin:16px 0 4px}
.auth-card p.lead{color:var(--text2);margin:0 0 24px}
.auth-card .f{margin-bottom:14px}
.auth-card .btn-primary{width:100%;justify-content:center;padding:10px}
.auth-links{display:flex;justify-content:space-between;margin-top:14px;font-size:13px}
.auth-foot{margin-top:18px;text-align:center;font-size:12px;color:var(--text2)}

/* ---------- Modal (L5) ---------- */
.overlay{position:fixed;inset:0;background:rgba(35,34,31,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.overlay.open{display:flex}
.modal{background:var(--card);border-radius:var(--r-lg);width:100%;max-width:460px;box-shadow:0 20px 50px rgba(35,34,31,.25);animation:pop .16s ease-out}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
.modal-body{padding:22px 22px 8px}
.modal-body h2{font-size:18px;margin:0 0 8px}
.modal-body p{margin:0 0 14px;color:var(--text2)}
.modal-body ul{margin:0 0 14px;padding-left:18px;color:var(--text2);font-size:13px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px 20px}

/* ---------- Toast ---------- */
.toast{position:fixed;bottom:24px;right:24px;display:flex;gap:10px;align-items:flex-start;background:var(--text);color:#fff;padding:12px 16px;border-radius:var(--r-md);max-width:420px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.2);transform:translateY(20px);opacity:0;pointer-events:none;transition:all .2s;z-index:60}
.toast.show{transform:none;opacity:1}
.toast .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none}
.toast .spec{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.3);margin-left:6px}

/* ---------- User list v3 ---------- */
.list-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.list-head h1{margin:0}
.list-head p{margin:4px 0 0;color:var(--text2)}
.head-actions{display:flex;gap:8px;align-items:center;flex:none}
.list-head > div:first-child{flex:1;min-width:0}
@media (min-width:761px){.list-head{flex-wrap:nowrap}}
.lock-callout{display:flex;align-items:center;gap:10px;padding:10px 14px;margin-bottom:14px;border-radius:var(--r-md);background:var(--warning-bg);border:1px solid #EDD39C;color:#6E5210;font-size:13px}
.lock-callout svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;flex:none}
.lock-callout .grow{flex:1}
.link-btn{background:none;border:0;padding:0;font-weight:600;color:var(--admin);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.lock-callout .link-btn{color:#6E5210}

.ucard{overflow:hidden}
.ucard-top{padding:14px 16px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer}
.chip:hover{border-color:#D4D1C8;color:var(--text)}
.chip b{font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:#fff}
.chip[aria-pressed="true"] b{color:#fff}
.ucard-tools{display:flex;gap:10px;align-items:center;padding:12px 16px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.ucard-tools .search{flex:1;min-width:220px}
.ucard-tools .input,.ucard-tools .select{height:38px}
.ucard-tools .select{min-width:160px}
.rank-toggle{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 12px;border-radius:var(--r-sm);border:1px solid var(--border);cursor:pointer;font-weight:500;font-size:13px;color:var(--text2);user-select:none;background:var(--card)}
.rank-toggle input{accent-color:var(--admin);margin:0}
.rank-toggle.on{background:var(--admin-bg);border-color:var(--admin-border);color:var(--admin);font-weight:600}

.utable th{background:var(--card);font-weight:500}
.utable td{padding:11px 16px;white-space:nowrap}
.utable tbody tr:not(.grp):hover{background:#F8F6FC}
.utable tr.grp{cursor:default}
.utable tr.grp td{padding:14px 16px 6px;border-bottom:0;font-size:12px;font-weight:600;color:var(--text2);background:var(--card)}
.utable tr.grp td span{display:inline-flex;align-items:center;gap:8px}

// Cấp bậc hiển thị: 1 Admin > 2 Manager > 3 PT > 4 Lễ tân
const RANK={'Admin':1,'Manager':2,'PT':3,'Lễ tân':4};
const ROLE_COLOR={'Admin':'#5B3FA0','Manager':'#3B4FA0','PT':'#0E8E82','Lễ tân':'#0B766C','Khách':'#E2583E'};
const STATUS_ORDER={active:0,temp:1,locked:2,inactive:3};
const PAGE_SIZE=10;
let listState={tab:'staff',role:'all',status:'all',q:'',rankFirst:true,sort:{key:null,dir:1},page:1};
const loginKey=d=>{if(!d)return '';const[dd,t]=d.split(' ');const[a,b,c]=dd.split('/');return `${c}${b}${a}${t}`};
const firstLetter=n=>n.trim().split(' ').pop()[0].toUpperCase();

function sortedStaff(){
  const q=listState.q.toLowerCase();
  let rows=users.filter(u=>(listState.role==='all'||u.role===listState.role)&&(listState.status==='all'||u.status===listState.status)&&(!q||(u.name+u.email+u.phone+u.id).toLowerCase().includes(q)));
  const {key,dir}=listState.sort;
  const cmp={
    name:(a,b)=>a.name.split(' ').pop().localeCompare(b.name.split(' ').pop(),'vi')||a.name.localeCompare(b.name,'vi'),
    role:(a,b)=>RANK[a.role]-RANK[b.role],
    status:(a,b)=>STATUS_ORDER[a.status]-STATUS_ORDER[b.status],
    login:(a,b)=>loginKey(a.lastLogin).localeCompare(loginKey(b.lastLogin)),
  };
  rows.sort((a,b)=>{
    if(listState.rankFirst){const r=RANK[a.role]-RANK[b.role];if(r)return r}
    if(key){const c=cmp[key](a,b)*dir;if(c)return c}
    return STATUS_ORDER[a.status]-STATUS_ORDER[b.status]||cmp.name(a,b);
  });
  return rows;
}

function exportCsv(){
  const head=['Cấp','Mã','Họ tên','Email','SĐT','Vai trò','Trạng thái','Đăng nhập gần nhất'];
  const lines=[head,...sortedStaff().map(u=>[RANK[u.role],u.id,u.name,u.email,u.phone,u.role,STATUS[u.status][0],u.lastLogin||''])]
    .map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(','));
  const blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='tai-khoan-he-thong.csv';a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

        </div>
      </aside>`}
    </div>`;
  render(shell('users',`<a href="#/users">Tài khoản hệ thống</a> / <b>${isNew?'Thêm tài khoản':esc(u.name)}</b>`,body));

  const be=document.getElementById('btnEdit'); if(be) be.onclick=()=>{editing=true;viewUserDetail(id)};
  const bc=document.getElementById('btnCancel'); if(bc) bc.onclick=()=>{editing=false};
  document.querySelectorAll('[data-blocked]').forEach(b=>b.onclick=()=>toast('MSG-031','danger'));
  const save=document.getElementById('btnSave');
  if(save) save.onclick=e=>{
    e.preventDefault();
    const v={name:val('i-name').trim(),email:val('i-email').trim(),phone:val('i-phone').trim(),role:val('i-role')};
    let ok=true;
    ok&=mark('f-name',v.name.length>0);
    ok&=mark('f-email',/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email));
    ok&=mark('f-phone',/^0(3|5|7|8|9)\d{8}$/.test(v.phone));
    if(!ok) return;
    const dup=users.find(x=>x.id!==u.id&&x.status!=='inactive'&&(x.phone===v.phone||x.email.toLowerCase()===v.email.toLowerCase()));
    if(dup){toast('MSG-030','danger');return}
    if(isNew){
      const nid='NV0'+(20+users.length);
      users.push({id:nid,...v,status:'active',since:'09/2026',lastLogin:''});
      toast('MSG-028','success');editing=false;location.hash='#/users';
    } else {
      Object.assign(u,v);editing=false;toast('MSG-029','success');location.hash='#/users';
    }
  };
  // live phone validation (FR-05)
  const ip=document.getElementById('i-phone');
  if(ip&&edit){ip.oninput=()=>{ip.value=ip.value.replace(/\D/g,'');if(ip.value.length===10)mark('f-phone',/^0(3|5|7|8|9)\d{8}$/.test(ip.value));else document.getElementById('f-phone').classList.remove('invalid')}}

  document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{
    const a=b.dataset.act;
    if(a==='lock') confirmModal({title:`Khóa tài khoản ${u.name}?`,text:`<p>Người này bị đăng xuất khỏi mọi phiên và không đăng nhập được cho tới khi Admin mở khóa.</p>`,ok:'Khóa tài khoản',onOk:r=>{u.status='locked';u.lockReason=r;done()}});
    if(a==='deactivate') confirmModal({title:`Vô hiệu hóa tài khoản ${u.name}?`,text:`<p>Dùng khi nhân viên nghỉ việc. Sau khi xác nhận:</p><ul><li>Khóa quyền và đăng xuất mọi phiên ngay lập tức</li><li>Giữ nguyên lịch sử buổi dạy, ca trực, giao dịch</li><li>Giải phóng SĐT và email để dùng cho hồ sơ khác</li></ul>`,ok:'Vô hiệu hóa',onOk:()=>{u.status='inactive';u.leftAt='19/09/2026';done()}});
    if(a==='unlock') confirmModal({title:`Mở khóa tài khoản ${u.name}?`,text:`<p>Người này đăng nhập lại được ngay bằng mật khẩu hiện tại.</p>`,ok:'Mở khóa',safe:true,onOk:()=>{u.status='active';done()}});
  });
  function done(){toast('MSG-032','success');viewUserDetail(id)}
}

let auditState={actor:'all',type:'all',from:'2026-09-01',to:'2026-09-19',obj:''};
function viewAudit(){
  const hq=new URLSearchParams(location.hash.split('?')[1]||'');
  if(hq.get('obj')!==null){auditState.obj=hq.get('obj');}
  const toISO=d=>{const [dd,mm,yy]=d.split('/');return `${yy}-${mm}-${dd}`};
  const list=audit.filter(a=>
    (auditState.actor==='all'||(a.actor||'Hệ thống')===auditState.actor)&&
    (auditState.type==='all'||a.type===auditState.type)&&
    toISO(a.d)>=auditState.from&&toISO(a.d)<=auditState.to&&
    (!auditState.obj||a.obj===auditState.obj||a.actor===auditState.obj));
  const actors=[...new Set(audit.map(a=>a.actor||'Hệ thống'))];
  const types=[...new Set(audit.map(a=>a.type))];
  const days=[...new Set(list.map(a=>a.d))];
  const dayName=d=>{const [dd,mm,yy]=d.split('/');const w=['Chủ nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'][new Date(`${yy}-${mm}-${dd}`).getDay()];return `${w}, ${d}`};
  const sentence=a=>{
    const who=a.actor?`<span class="actor"><span class="r">${a.role}</span> ${esc(a.actor)}</span>`:`<span class="actor">Hệ thống</span>`;
    const change=a.from?` từ <span class="v-old">${esc(a.from)}</span> sang <span class="v-new">${esc(a.to)}</span>`:` với trạng thái <span class="v-new">${esc(a.to)}</span>`;
    return `${who} ${esc(a.did)} <span class="obj">${esc(a.obj)}</span>${change}.`;
  };
  const body=`
    <div class="page-head">
      <div><h1>Audit Log</h1><p>Mọi thao tác nhạy cảm được ghi tự động: đổi giá, thao tác tài khoản, xóa, duyệt và từ chối.</p></div>
      <div class="readonly-note">${I.lock} Chỉ tra cứu. Bản ghi không sửa, không xóa được.</div>
    </div>
    <div class="card">
      <div class="filters">
        <div class="field-inline"><label for="a-actor">Người thao tác</label><select class="select" id="a-actor"><option value="all">Tất cả</option>${actors.map(x=>`<option ${auditState.actor===x?'selected':''}>${x}</option>`).join('')}</select></div>
        <div class="field-inline"><label for="a-type">Đối tượng</label><select class="select" id="a-type"><option value="all">Tất cả</option>${types.map(x=>`<option ${auditState.type===x?'selected':''}>${x}</option>`).join('')}</select></div>
        <div class="field-inline"><label for="a-from">Từ ngày</label><input class="input" type="date" id="a-from" value="${auditState.from}"></div>
        <div class="field-inline"><label for="a-to">Đến ngày</label><input class="input" type="date" id="a-to" value="${auditState.to}"></div>
        ${auditState.obj?`<div class="field-inline"><label>Liên quan tới</label><button class="btn" id="clearObj" title="Bỏ lọc">${esc(auditState.obj)} ✕</button></div>`:''}
      </div>
      <div>
      ${list.length?days.map(d=>`<div class="ledger-day">${dayName(d)}</div>`+list.filter(a=>a.d===d).map(a=>`
        <article class="entry">
          <time>${a.t}</time>
          <div><div class="sentence">${sentence(a)}</div>
          <div class="why">Lý do: <b>${esc(a.why)}</b><span class="kind">${a.type}</span></div></div>
        </article>`).join('')).join(''):`<div class="empty">Không có bản ghi nào khớp bộ lọc. Thử mở rộng khoảng thời gian.</div>`}
      </div>
      <div class="table-foot"><span>${list.length} bản ghi</span><div class="pager"><button aria-current="page">1</button><button>2</button><button>3</button></div></div>
    </div>`;
  render(shell('audit','<b>Audit Log</b>',body));
  const bind=(id,key)=>document.getElementById(id).onchange=e=>{auditState[key]=e.target.value;viewAudit()};
  bind('a-actor','actor');bind('a-type','type');bind('a-from','from');bind('a-to','to');
  const co=document.getElementById('clearObj'); if(co) co.onclick=()=>{auditState.obj='';location.hash='#/audit'};
}

      <p class="lead">Nhập email của tài khoản. Mã khôi phục được gửi qua email và hết hạn sau 15 phút.</p>
      <div class="f"><label for="fg">Email</label><input class="input" id="fg" placeholder="ten@tenmien"></div>
      <button class="btn btn-primary" onclick="toast('Đã gửi mã khôi phục tới email nếu tài khoản tồn tại.','success',true)">Gửi mã khôi phục</button>
      <div class="auth-links"><a href="#/signin">Quay lại đăng nhập</a></div>
  </div></div>`);
}

/* ======================= HELPERS ======================= */
function render(html){document.getElementById('root').innerHTML=html;
  
  window.scrollTo(0,0);}
function val(id){return document.getElementById(id).value}
function mark(id,ok){document.getElementById(id).classList.toggle('invalid',!ok);return ok}
function fmtPhone(p){return p.replace(/(\d{4})(\d{3})(\d{3})/,'$1 $2 $3')}
function fmtCd(s){s=Math.max(0,s);return `${Math.floor(s/60)} phút ${String(s%60).padStart(2,'0')} giây`}
function unlockAt(s){const d=new Date(Date.now()+s*1000);return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
function bindRowNav(){document.querySelectorAll('[data-go]').forEach(r=>{r.onclick=e=>{if(e.target.closest('a'))return;editing=false;location.hash=r.dataset.go};r.onkeydown=e=>{if(e.key==='Enter'){editing=false;location.hash=r.dataset.go}}})}

let toastTimer;
function toast(code,kind,raw){
  const t=document.getElementById('toast');
  const text=raw?code:(MSG[code]||code);
  document.getElementById('toast-text').innerHTML=esc(text);
  t.querySelector('.dot').style.background=kind==='danger'?'#F07C86':'#6FD19B';
  t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),3600);
}

let modalCb=null,lastFocus=null;
function confirmModal({title,text,ok,onOk,safe}){
  lastFocus=document.activeElement;
  document.getElementById('m-title').textContent=title;
  document.getElementById('m-text').innerHTML=text;
  const okb=document.getElementById('m-ok');okb.textContent=ok;okb.className='btn '+(safe?'btn-primary':'btn-danger-solid');
  const r=document.getElementById('m-reason');r.value='';r.parentElement.classList.remove('invalid');
  modalCb=onOk;document.getElementById('overlay').classList.add('open');setTimeout(()=>r.focus(),30);
}
function closeModal(){document.getElementById('overlay').classList.remove('open');if(lastFocus)lastFocus.focus()}
document.getElementById('m-cancel').onclick=closeModal;
document.getElementById('overlay').onclick=e=>{if(e.target.id==='overlay')closeModal()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('overlay').classList.contains('open'))closeModal()});
document.getElementById('m-ok').onclick=()=>{
  const r=document.getElementById('m-reason');
  if(!r.value.trim()){r.parentElement.classList.add('invalid');r.focus();return}
  const cb=modalCb;closeModal();cb&&cb(r.value.trim());
};

// countdown for temp-locked customers
setInterval(()=>{
  tempLocked.forEach(c=>c.unlockInSec--);
  const expired=tempLocked.filter(c=>c.unlockInSec<=0);
  expired.forEach(c=>{c.status='active';c.fails=0});
  tempLocked=tempLocked.filter(c=>c.unlockInSec>0);
  document.querySelectorAll('[data-countdown]').forEach(el=>{
    const c=tempLocked.find(x=>x.id===el.dataset.countdown);
    if(c) el.textContent=fmtCd(c.unlockInSec);
  });
  if(expired.length && location.hash.startsWith('#/users')) route();
},1000);

/* ======================= ROUTER ======================= */
function route(){
  const h=(location.hash||'#/signin').split('?')[0];
  if(h==='#/signin') return viewSignIn();
  if(h==='#/forgot') return viewForgot();
  if(h==='#/users') return viewUserList();
  if(h.startsWith('#/users/')) return viewUserDetail(decodeURIComponent(h.slice(8)));
  if(h==='#/audit') return viewAudit();
  if(h==='#/report') return viewReport();
  if(h==='#/settings') return viewSettings();
  viewSignIn();
}
window.addEventListener('hashchange',route);
route();
</script>
