<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GMS Manager — Mockup v24</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@600;700;800&family=Montserrat:wght@600;700;800&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--role:#3B4FA0;--role-hover:#2F3F85;--role-bg:#EDEFFA;--role-border:#C5CCEC}
:root{
  --page:#FAFAF8; --card:#FFFFFF; --text:#23221F; --text2:#6B6960; --border:#E7E5DF;
  --success:#2F8F5B; --warning:#D69E2E; --danger:#D32F3F; --info:#2E6FBA;
  --success-bg:#E8F4EC; --warning-bg:#FBF3E2; --danger-bg:#FBE9EA; --info-bg:#E8F0F9;
  --r-sm:6px; --r-md:10px; --r-lg:14px;
  --font:"Work Sans","Segoe UI",system-ui,sans-serif;
  --heading:"Be Vietnam Pro","Segoe UI",system-ui,sans-serif;
  --display:"Montserrat","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);font-size:14px;line-height:1.5;color:var(--text);background:var(--page);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--role)}
:focus-visible{outline:2px solid var(--role);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--text2)}

.app{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}
.sidebar{background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:18px 20px 14px}
.brand-mark{width:32px;height:32px;border-radius:8px;background:var(--role);color:#fff;display:grid;place-items:center;font:800 12px var(--display)}
.brand-name{font:700 15px/1.2 var(--display)}
.brand-role{font-size:12px;color:var(--role);font-weight:600}
.nav{padding:4px 12px;display:flex;flex-direction:column;gap:1px;flex:1}
.nav-group{font-size:12px;color:var(--text2);padding:12px 10px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-sm);color:var(--text);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--page)}
.nav a.active{background:var(--role-bg);color:var(--role);font-weight:600;box-shadow:inset 3px 0 0 var(--role)}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav .badge{margin-left:auto;background:var(--danger);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:0 7px;line-height:18px}
.side-foot{border-top:1px solid var(--border);padding:12px}
.me{display:flex;align-items:center;gap:10px;padding:8px;border-radius:var(--r-sm);text-decoration:none;color:var(--text)}
.me:hover{background:var(--page)}
.me small{display:block;color:var(--text2);font-size:12px}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:12px;flex:none;background:var(--role-bg);color:var(--role)}
.logout{margin-top:4px;width:100%;text-align:left;background:none;border:0;padding:8px;border-radius:var(--r-sm);color:var(--text2);cursor:pointer}
.logout:hover{background:var(--page);color:var(--text)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 32px;border-bottom:1px solid var(--border);background:var(--card);flex-wrap:wrap}
.crumbs{font-size:13px;color:var(--text2)}
.crumbs a{color:var(--text2);text-decoration:none}
.crumbs a:hover{color:var(--role)}
.crumbs b{color:var(--text);font-weight:600}
.top-right{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.spec-toggle{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2);cursor:pointer;user-select:none}
.spec-toggle input{accent-color:var(--role)}
.content{padding:26px 32px 72px;max-width:1240px;width:100%}

.spec{display:inline-flex;align-items:center;font:600 11px/1.4 var(--font);text-transform:none;letter-spacing:0;color:var(--role);background:var(--role-bg);border:1px dashed var(--role-border);border-radius:4px;padding:1px 6px;vertical-align:middle;white-space:nowrap}
body.no-spec .spec,body.no-spec .spec-only{display:none!important}

.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-head>div:first-child{flex:1;min-width:0}
.page-head h1{font:700 26px/1.3 var(--heading);text-transform:uppercase;letter-spacing:.02em;margin:0 0 4px}
.page-head h1 .spec{vertical-align:4px}
.page-head p{margin:0;color:var(--text2);max-width:72ch}
.head-actions{display:flex;gap:8px;flex-wrap:wrap;flex:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--card);padding:8px 14px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--text);transition:background .12s,border-color .12s;white-space:nowrap}
.btn:hover{background:var(--page);border-color:#D4D1C8}
.btn-primary{background:var(--role);border-color:var(--role);color:#fff}
.btn-primary:hover{background:var(--role-hover);border-color:var(--role-hover)}
.btn-danger{color:var(--danger);border-color:#EFC5C9}
.btn-danger:hover{background:var(--danger-bg);border-color:var(--danger)}
.btn-danger-solid{background:var(--danger);border-color:var(--danger);color:#fff}
.btn-danger-solid:hover{background:#B72633}
.btn-success{background:var(--success);border-color:var(--success);color:#fff}
.btn-success:hover{background:#26764B}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.btn-sm{padding:5px 11px;font-size:13px}
.btn-lg{padding:12px 20px;font-size:15px}
.btn-block{width:100%}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md)}
.pad{padding:20px}
.card h2{font:600 16px/1.35 var(--heading);margin:0 0 4px}
.card .sub{color:var(--text2);font-size:13px;margin:0 0 16px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.card-head h2{margin:0}
.stack>*+*{margin-top:16px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.grid-half{display:grid;grid-template-columns:1fr 1fr;gap:16px}

.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border)}
.input,.select,textarea.input{border:1px solid var(--border);background:var(--card);border-radius:var(--r-sm);padding:8px 10px;min-height:38px;width:100%}
textarea.input{min-height:84px;resize:vertical}
.input:focus,.select:focus,textarea.input:focus{outline:none;border-color:var(--role);box-shadow:0 0 0 3px var(--role-bg)}
.input[readonly],.input:disabled,.select:disabled{background:var(--page);color:var(--text2)}
.filters .select{width:auto;min-width:150px}
.search{position:relative;flex:1;min-width:220px}
.search .input{padding-left:34px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--text2);fill:none;stroke-width:2}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);padding:0 12px;overflow-x:auto}
.tabs button{border:0;background:none;padding:12px 12px;font-weight:600;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--role);border-color:var(--role)}
.tabs .count{font-size:11px;background:var(--page);border:1px solid var(--border);padding:0 6px;border-radius:999px;margin-left:6px;color:var(--text2)}
.tabs button[aria-selected="true"] .count{background:var(--role-bg);border-color:var(--role-border);color:var(--role)}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;padding:10px 16px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover{background:var(--role-bg)}
tr.pinned td{background:#FFFBF2}
tr.struck td{color:var(--text2);text-decoration:line-through}
tr.struck td.keep{text-decoration:none}
td.r,th.r{text-align:right}
td.num,td.r{white-space:nowrap}
.who{display:flex;align-items:center;gap:10px}
.who b{display:block;font-weight:600}
.who small{color:var(--text2);font-size:12px}
.table-foot{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-top:1px solid var(--border);color:var(--text2);font-size:13px;gap:10px;flex-wrap:wrap}
.empty{padding:40px 16px;text-align:center;color:var(--text2)}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.nodot::before{display:none}
.p-ok{background:var(--success-bg);color:var(--success)}
.p-warn{background:var(--warning-bg);color:#A87712}
.p-danger{background:var(--danger-bg);color:var(--danger)}
.p-info{background:var(--info-bg);color:var(--info)}
.p-muted{background:#F0EFEB;color:var(--text2)}
.p-role{background:var(--role-bg);color:var(--role)}

.f{display:flex;flex-direction:column;gap:6px}
.f label,.f .lbl{font-size:13px;font-weight:600}
.f .req{color:var(--danger);margin-left:2px}
.f .hint{font-size:12px;color:var(--text2)}
.f .err{font-size:12px;color:var(--danger);display:none}
.f.bad .input,.f.bad .select{border-color:var(--danger)}
.f.bad .err{display:block}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.full{grid-column:1/-1}
.form-actions{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--border);background:#FCFCFA;border-radius:0 0 var(--r-md) var(--r-md);flex-wrap:wrap}
.radio-row{display:flex;gap:10px;flex-wrap:wrap}
.opt{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:var(--r-sm);padding:9px 12px;cursor:pointer;background:var(--card)}
.opt input{accent-color:var(--role);margin:0}
.opt:has(input:checked){border-color:var(--role);background:var(--role-bg)}
.opt:has(input:disabled){opacity:.55;cursor:not-allowed}
.check{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.check input{accent-color:var(--role);margin-top:3px}

.banner{display:flex;gap:12px;padding:12px 14px;border-radius:var(--r-sm);border:1px solid;font-size:13px;align-items:flex-start}
.banner+.banner{margin-top:10px}
.banner svg{width:18px;height:18px;flex:none;margin-top:1px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.banner b{display:block;margin-bottom:2px}
.banner ul{margin:6px 0 0;padding-left:18px}
.b-warn{background:var(--warning-bg);border-color:#EDD39C;color:#6E5210}
.b-info{background:var(--info-bg);border-color:#BFD3EC;color:#234F87}
.b-danger{background:var(--danger-bg);border-color:#F0C3C8;color:#8E1F2A}
.b-ok{background:var(--success-bg);border-color:#BFE0CB;color:#1F6B42}
.b-muted{background:var(--page);border-color:var(--border);color:var(--text2)}
.b-role{background:var(--role-bg);border-color:var(--role-border);color:var(--text)}

.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:13px;margin:0}
.kv dt{color:var(--text2)}
.kv dd{margin:0;font-weight:500}
.kv dd.r{text-align:right}
.sum{display:grid;grid-template-columns:1fr auto;gap:8px 16px;font-size:14px}
.sum .t{font-weight:700;font-size:18px;border-top:1px solid var(--border);padding-top:10px;font-family:var(--display)}

.stat{padding:16px 18px}
.stat .l{font-size:13px;color:var(--text2)}
.stat .v{font:700 28px/1.15 var(--display);margin:6px 0 2px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat .d{font-size:12px;color:var(--text2)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}

.tip-wrap{position:relative;display:inline-block}
.tip{display:none;position:absolute;right:0;top:calc(100% + 6px);width:260px;background:var(--text);color:#fff;font-size:12px;line-height:1.45;padding:9px 11px;border-radius:var(--r-sm);z-index:10;text-align:left;font-weight:400;white-space:normal}
.tip-wrap:hover .tip,.tip-wrap:focus-within .tip{display:block}

.overlay{position:fixed;inset:0;background:rgba(35,34,31,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.overlay.open{display:flex}
.modal{background:var(--card);border-radius:var(--r-lg);width:100%;max-width:480px;box-shadow:0 20px 50px rgba(35,34,31,.25);animation:pop .16s ease-out}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
.modal-body{padding:22px 22px 6px}
.modal-body h2{font:600 18px var(--heading);margin:0 0 8px}
.modal-body p{margin:0 0 14px;color:var(--text2)}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px 20px}

.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--card);border-left:1px solid var(--border);z-index:45;transform:translateX(100%);transition:transform .2s,visibility .2s;visibility:hidden;display:flex;flex-direction:column}
.drawer.open{transform:none;visibility:visible;box-shadow:-10px 0 30px rgba(35,34,31,.12)}
.drawer-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border)}
.drawer-head h2{font:600 16px var(--heading);margin:0}
.drawer-body{padding:20px;overflow:auto;flex:1}
.x{border:0;background:none;font-size:20px;cursor:pointer;color:var(--text2);line-height:1}

.toast{position:fixed;bottom:24px;right:24px;display:flex;gap:10px;align-items:flex-start;background:var(--text);color:#fff;padding:12px 16px;border-radius:var(--r-md);max-width:440px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.2);transform:translateY(20px);opacity:0;pointer-events:none;transition:all .2s;z-index:60}
.toast.show{transform:none;opacity:1}
.toast .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none}
.toast .spec{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.3);margin-left:6px}

.auth{min-height:100vh;display:grid;place-items:center;padding:24px}
.auth-card{width:100%;max-width:400px;padding:32px}
.auth-card h1{font:700 22px var(--heading);text-transform:uppercase;margin:16px 0 4px}

.mini-bar{height:8px;background:var(--page);border:1px solid var(--border);border-radius:4px;overflow:hidden}
.mini-bar i{display:block;height:100%;background:var(--role)}

@media (max-width:1024px){.grid2{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:static;height:auto;border-right:0;border-bottom:1px solid var(--border)}
  .nav{flex-direction:row;overflow-x:auto;padding:0 12px 10px}
  .nav-group,.side-foot{display:none}
  .nav a{white-space:nowrap}
  .content{padding:18px 16px 48px}
  .topbar{padding:10px 16px}
  .form-grid,.grid-half{grid-template-columns:1fr}
  table{min-width:640px}
}

/* ===== Layout kiểu khu Customer: sidebar dock trượt + topbar mang tiêu đề ===== */
body.dock{--sidebar-w:252px}
.dock .app{display:block;min-height:100vh}
.dock .dockwrap{position:fixed;left:0;top:0;bottom:0;width:0;z-index:120}
.dock .sidebar{position:absolute;left:0;top:0;height:100vh;width:var(--sidebar-w);display:flex;flex-direction:column;background:#0D0D0D;color:#C9C5BC;border:0;padding:20px 16px 16px;overflow-y:auto;transform:translateX(calc(-1 * var(--sidebar-w)));transition:transform .28s cubic-bezier(.4,0,.2,1);box-shadow:0 0 40px rgba(0,0,0,.35)}
.dock .dockwrap:hover .sidebar,.dock .dockwrap:focus-within .sidebar,.dock .dockwrap.is-open .sidebar{transform:none}
.dock .dock-handle{position:absolute;left:0;top:50%;translate:0 -50%;width:28px;height:72px;border:0;border-radius:0 10px 10px 0;background:var(--role);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:4px 0 18px rgba(0,0,0,.22);transition:left .28s cubic-bezier(.4,0,.2,1),background .15s}
.dock .dockwrap:hover .dock-handle,.dock .dockwrap:focus-within .dock-handle,.dock .dockwrap.is-open .dock-handle{left:var(--sidebar-w)}
.dock .dock-handle:hover{background:var(--role-hover)}
.dock .dock-handle svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;transition:rotate .28s}
.dock .dockwrap:hover .dock-handle svg,.dock .dockwrap.is-open .dock-handle svg{rotate:180deg}
.dock .brand{display:block;padding:0 8px;margin-bottom:28px}
.dock .brand-mark{display:none}
.dock .brand-name{display:block;font:800 19px/1.2 var(--display);letter-spacing:-.02em;text-transform:uppercase;color:#fff}
.dock .brand-role{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--role-border);font-weight:600}
.dock .nav{padding:0;gap:4px;flex:none}
.dock .nav-group{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.12em;color:#6F6C64;padding:0;margin:22px 8px 6px}
.dock .nav-group:first-child{margin-top:0}
.dock .nav a{color:#C9C5BC;padding:8px 12px;font-size:14px;border-radius:8px;box-shadow:none}
.dock .nav a svg{opacity:.75}
.dock .nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.dock .nav a.active{background:var(--role);color:#fff;font-weight:600;box-shadow:none}
.dock .nav a.active svg{opacity:1}
.dock .side-foot{margin-top:auto;padding:20px 0 0;border-top:1px solid rgba(255,255,255,.09)}
.dock .side-foot .me{display:none}
.dock .logout{color:#8F8B81;padding:8px 12px;margin:0}
.dock .logout:hover{color:#fff;background:rgba(255,255,255,.06)}
.dock .main{min-height:100vh}
.dock .topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:16px;flex-wrap:nowrap;padding:14px max(48px,calc((100% - 1224px)/2)) 14px max(76px,calc((100% - 1224px)/2));background:rgba(250,250,248,.93);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.dock .tb-left{min-width:0}
.dock .tb-left .crumbs{font-size:12.5px}
.dock .tb-title{font:700 18px/1.3 var(--heading);text-transform:uppercase;letter-spacing:.02em;margin:2px 0 0;color:var(--text)}
.dock .tb-title .spec{vertical-align:2px;text-transform:none;letter-spacing:0}
.dock .top-right{margin-left:auto;display:flex;align-items:center;gap:14px;flex:none}
.dock .tb-user{display:flex;align-items:center;gap:12px;padding:6px 8px 6px 16px;border-left:1px solid var(--border);border-radius:8px;text-decoration:none;color:var(--text);transition:background .15s}
.dock .tb-user:hover{background:var(--role-bg)}
.dock .tb-user .avatar{width:36px;height:36px;background:var(--role);color:#fff;font:700 13px var(--display)}
.dock .tb-user b{display:block;font-size:13.5px;font-weight:600;line-height:1.3}
.dock .tb-user small{font-size:12px;color:var(--text2)}
.dock .content{padding:40px max(48px,calc((100% - 1224px)/2)) 72px max(76px,calc((100% - 1224px)/2));max-width:none}
.dock .page-intro{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.dock .page-intro p{margin:0;color:var(--text2);max-width:72ch}
@media (max-width:900px){
  .dock .topbar{padding:12px 16px 12px 46px}
  .dock .content{padding:24px 16px 64px 46px}
  .dock .tb-user-text,.dock .spec-toggle span{display:none}
}
@media (max-width:760px){.dock .sidebar{position:absolute;height:100vh}.dock .nav{flex-direction:column;overflow:visible;padding:0}.dock .nav-group,.dock .side-foot{display:block}}

</style>
</head>
<body class="dock">
<div id="root"></div>
<div id="chrome"></div>
<script>
/* ===================== CORE (dùng chung Lễ tân / Manager) ===================== */
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];

  t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),4000);

function modal({title,text,ok='Xác nhận',danger=false,reason=false,reasonLabel='Lý do',reasonErr='Vui lòng nhập lý do.',onOk}){
  lastFocus=document.activeElement;modalNeedReason=reason;
  $('#m-title').innerHTML=title;$('#m-text').innerHTML=text||'';
  const w=$('#m-reason-wrap');w.style.display=reason?'':'none';w.classList.remove('bad');
  $('#m-reason-label').innerHTML=reasonLabel+' <span class="req">*</span>';$('#m-reason-err').innerHTML=reasonErr;$('#m-reason').value='';
  const b=$('#m-ok');b.textContent=ok;b.className='btn '+(danger?'btn-danger-solid':'btn-primary');
  modalCb=onOk;$('#overlay').classList.add('open');setTimeout(()=>(reason?$('#m-reason'):b).focus(),30);
}

  $('#m-cancel').onclick=closeModal;

}

function exportCSV(name,headers,rows){
  const q=v=>{v=String(v??'');return /[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const csv='\uFEFF'+[headers,...rows].map(r=>r.map(q).join(',')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();a.remove();
  toast('',`Đã xuất ${rows.length} dòng ra file ${name}.`);
}

function viewParams(){

    <div class="banner b-info" style="margin-bottom:16px">${I.info}<span>Thay đổi chỉ áp dụng cho bản ghi tạo mới từ thời điểm lưu, không áp ngược cho đơn và hồ sơ đã tạo.</span></div>
    <div class="card"><div class="table-wrap"><table><thead><tr><th>Tham số</th><th class="r">Giá trị</th><th></th></tr></thead><tbody>
    ${PARAMS.map(p=>`<tr class="click" tabindex="0" data-go="${p.link||'#/params/'+p.k}"><td><b>${p.label}</b><div class="muted" style="font-size:12px">${p.link?'Sửa ở màn Giờ hoạt động':'Áp dụng cho bản ghi tạo mới từ thời điểm lưu'}</div></td><td class="r num"><b style="font-size:15px">${p.v}</b> <span class="muted">${p.unit}</span></td><td class="r muted" style="width:40px">›</td></tr>`).join('')}
    </tbody></table></div></div>`));
  bindRows();
}
function viewParam(k){
  const p=PARAMS.find(x=>x.k===k);if(!p||p.link){location.hash='#/params';return}
  render(page('params',crumb(['Tham số','#/params'],[p.label]),p.label,'4.1.2 / L2 / UC-09',p.desc,'',`
    <div class="card" style="max-width:720px"><div class="pad">
      <div class="grid-half" style="margin-bottom:16px">
        <div class="f"><span class="lbl">Giá trị hiện tại</span><div class="input num" style="background:var(--page);display:flex;align-items:center">${p.v} ${p.unit}</div></div>
        <div class="f" id="f-pv"><label for="pv">Giá trị mới<span class="req">*</span></label><input class="input num" id="pv" ${p.type==='time'?'type="time"':'inputmode="numeric"'} value="${p.v}"><span class="err" id="pvErr"></span><span class="hint">${p.type==='time'?p.unit:`Từ ${p.min} đến ${p.max} ${p.unit}`}</span></div>
      </div>
      <div class="banner b-info">${I.info}<span>Thay đổi chỉ áp dụng cho bản ghi tạo mới từ thời điểm lưu, không áp ngược cho đơn và hồ sơ đã tạo.</span></div>
      <p class="muted" style="font-size:12px;margin:12px 0 0">Mọi lần sửa được ghi vào nhật ký hệ thống để Admin tra cứu.</p>
    </div><div class="form-actions"><a class="btn" href="#/params">Hủy</a><button class="btn btn-primary" id="pSave">Lưu</button></div></div>`));
  $('#pSave').onclick=()=>{const v=val('pv').trim();let err=null;
    if(p.type==='time'){if(!/^\d{2}:\d{2}$/.test(v))err='Nhập giờ dạng hh:mm.';
      else if(k==='leaveApprove'&&v<=PARAMS.find(x=>x.k==='leaveSubmit').v)err='Giờ chốt duyệt phải muộn hơn giờ chốt nộp ('+PARAMS.find(x=>x.k==='leaveSubmit').v+').';
      else if(k==='leaveSubmit'&&v>=PARAMS.find(x=>x.k==='leaveApprove').v)err='Giờ chốt nộp phải sớm hơn giờ chốt duyệt ('+PARAMS.find(x=>x.k==='leaveApprove').v+').'}
    else {const n=Number(v);if(v===''||isNaN(n)||!Number.isInteger(n)||n<p.min||n>p.max)err=`Phải là số nguyên từ ${p.min} đến ${p.max}.`}
    if(err){$('#pvErr').innerHTML='Giá trị không hợp lệ. '+err+' ';mark('f-pv',false);return}
    p.v=p.type==='time'?v:Number(v);toast('MSG-035','Đã cập nhật tham số.');location.hash='#/params'};
}

  render(page('blog',crumb(['Blog','#/blog'],[isNew?'Bài mới':b.title]),isNew?'Bài viết mới':'Sửa bài viết','11.1.2 / L2 / UC-45',b.status==='Active'?'Bài đang đăng trên trang công khai.':'Bài đang là nháp, chưa hiện ở trang công khai.','',`
    <div class="grid2"><div class="card"><div class="pad stack">
      <div class="f" id="f-bt"><label for="bt">Tiêu đề<span class="req">*</span></label><input class="input" id="bt" style="font-size:18px;font-weight:600" value="${esc(b.title)}"><span class="err">Tiêu đề không được để trống.</span></div>
      <div class="f"><span class="lbl">Nội dung</span>
        <div style="border:1px solid var(--border);border-radius:var(--r-sm)"><div style="display:flex;gap:4px;padding:6px;border-bottom:1px solid var(--border);background:#FCFCFA">
          ${[['bold','<b>B</b>'],['italic','<i>I</i>'],['formatBlock:h2','H2'],['insertUnorderedList','• Danh sách']].map(([c,l])=>`<button class="btn btn-sm" data-cmd="${c}" type="button">${l}</button>`).join('')}</div>
        <div id="bb" contenteditable="true" style="min-height:280px;padding:14px 16px;outline:none;font-size:15px;line-height:1.7">${b.body}</div></div></div>
    </div><div class="form-actions"><a class="btn" href="#/blog">Hủy</a><button class="btn" id="draft">Lưu nháp</button><button class="btn btn-primary" id="pub">Đăng</button></div></div>
    <aside class="card pad"><h2>Ảnh đại diện</h2><p class="sub">Hiện ở thẻ bài trên trang Blog.</p>
      <div id="cover" style="aspect-ratio:16/9;border:1px dashed var(--border);border-radius:var(--r-sm);display:grid;place-items:center;color:var(--text2);background:var(--page);cursor:pointer">${b.cover?'<span style="color:var(--role);font-weight:600">anh-bia.jpg · 1200×675</span>':'Bấm để chọn ảnh'}</div></aside></div>`));
  $$('[data-cmd]').forEach(x=>x.onclick=()=>{const[c,a]=x.dataset.cmd.split(':');document.execCommand(c,false,a);$('#bb').focus()});
  $('#cover').onclick=()=>{b.cover=true;$('#cover').innerHTML='<span style="color:var(--role);font-weight:600">anh-bia.jpg · 1200×675</span>'};
  const save=st=>{if(!mark('f-bt',!!val('bt').trim()))return;
    const doIt=()=>{Object.assign(b,{title:val('bt').trim(),body:$('#bb').innerHTML,status:st});if(st==='Active'&&b.date==='—')b.date='20/09/2026';if(isNew)BLOG.unshift({...b,id:BLOG.length+10});toast('',st==='Active'?'Đã đăng bài.':'Đã lưu nháp.');location.hash='#/blog'};
    if(st==='Inactive'&&b.status==='Active'&&!isNew)modal({title:'Gỡ đăng bài?',text:`<p>Lưu nháp sẽ gỡ bài "${esc(b.title)}" khỏi trang công khai ngay lập tức.</p>`,ok:'Gỡ đăng và lưu nháp',danger:true,onOk:doIt});else doIt()};
  $('#draft').onclick=()=>save('Inactive');$('#pub').onclick=()=>save('Active');
}

/* ---------- 11.2.1 NOTIFY ---------- */
function viewNotify(){
  render(page('notify',crumb(['Thông báo']),'Gửi thông báo','11.2.1 / L2 / UC-44','Thông báo do Quản lý chủ động gửi. Thông báo tự động của hệ thống (đổi lịch buổi tập, kết quả duyệt đơn) không đi qua màn này.','',`
    <div class="grid2"><div class="card"><div class="pad stack">
      <div class="f" id="f-nt"><label for="nt">Tiêu đề<span class="req">*</span></label><input class="input" id="nt"><span class="err">Tiêu đề không được để trống.</span></div>
      <div class="f" id="f-nc"><label for="nc">Nội dung (chỉ văn bản)<span class="req">*</span></label><textarea class="input" id="nc" rows="6"></textarea><span class="err">Nội dung thông báo không được để trống.</span></div>
      <div class="f"><span class="lbl">Gửi tới</span><div class="radio-row">${['Tất cả','Hội viên','PT','Lễ tân','Nhân viên (PT và Lễ tân)'].map((x,i)=>`<label class="opt"><input type="radio" name="to" value="${x}" ${i===0?'checked':''}> ${x}</label>`).join('')}</div></div>
    </div><div class="form-actions"><button class="btn btn-primary" id="send">Gửi thông báo</button></div></div>
    <aside class="card"><div class="card-head"><h2>Đã gửi gần đây</h2></div><ul style="list-style:none;margin:0;padding:6px 20px 12px">${SENT.map(s=>`<li style="padding:10px 0;border-bottom:1px solid var(--border)"><b>${esc(s.title)}</b><div class="muted" style="font-size:12px">${s.to} · ${s.at}</div></li>`).join('')}</ul></aside></div>`));
  $('#send').onclick=()=>{const ok=mark('f-nt',!!val('nt').trim())&mark('f-nc',!!val('nc').trim());if(!ok)return;const to=$('input[name=to]:checked').value;
    modal({title:`Gửi tới ${to}?`,text:'<p>Thông báo gửi ngay, không thu hồi được.</p>',ok:'Gửi',onOk:()=>{SENT.unshift({title:val('nt').trim(),to,at:'20/09/2026 14:20'});toast('MSG-179',`Đã gửi thông báo tới ${to}.`);viewNotify()}})};
}

/* ---------- 12.1.1 REPORT ---------- */
let RP={from:'2026-09-01',to:'2026-09-20'};
function viewReport(){
  const bad=RP.from>RP.to;
  const days=20;let rev=[18.2,12.4,9.8,15.1,22.6,31.4,26.8,14.9,11.2,13.7,19.5,24.8,33.1,28.4,16.3,12.9,14.4,21.7,27.3,19.6].slice(0,days);
  const pk=[['Gói 1 tháng',42,18900000],['Gói 3 tháng',31,39990000],['Gói 9 tháng',9,31050000],['Gói 12 tháng',14,58800000],['Vé 1 ngày',186,11160000],['Gói PT (các loại)',17,86400000]];
  const total=pk.reduce((a,p)=>a+p[2],0);const raw=rev.reduce((a,b)=>a+b,0);rev=rev.map(v=>v*total/1e6/raw);
  const pts=[['Phạm Đức Thắng',70,58,3,2,1],['Hoàng Mai Linh',72,52,4,1,0],['Đinh Công Sơn',70,34,2,3,1],['Mai Phương Thảo',65,29,1,0,2]];
  const commOf=p=>(p[2]+p[3]+p[4]+p[5])*400000*p[1]/100;const commTotal=pts.reduce((a,p)=>a+commOf(p),0);
  const W=680,H=220,pad=34,bw=(W-pad-10)/days;const max=25;
  const svg=`<svg viewBox="0 0 ${W} ${H+24}" role="img" aria-label="Doanh thu theo ngày" style="width:100%;height:auto">
    ${[0,5,10,15,20].map(v=>{const y=H-v/max*(H-16);return `<line x1="${pad}" x2="${W-6}" y1="${y}" y2="${y}" stroke="#E7E5DF"/><text x="${pad-6}" y="${y+4}" font-size="10" text-anchor="end" fill="#6B6960">${v}tr</text>`}).join('')}
    ${rev.map((v,i)=>{const h=v/max*(H-16),x=pad+i*bw+bw*.18;return `<rect x="${x}" y="${H-h}" width="${bw*.64}" height="${h}" rx="3" fill="${i===days-1?'#3B4FA0':'#B9C1E6'}"><title>${i+1}/09: ${v.toFixed(1)} triệu</title></rect>${i%3===0?`<text x="${x+bw*.32}" y="${H+16}" font-size="10" text-anchor="middle" fill="#6B6960">${i+1}/9</text>`:''}`}).join('')}</svg>`;
  const vat=PARAMS.find(p=>p.k==='vat').v;
  render(page('report',crumb(['Báo cáo']),'Báo cáo vận hành & doanh thu','12.1.1 / L1 / UC-46',`Số liệu cập nhật lúc 14:20 20/09, không theo thời gian thực.`,`
    <div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap"><div class="f"><label for="rf">Từ ngày</label><input class="input" type="date" id="rf" value="${RP.from}"></div><div class="f"><label for="rt">Đến ngày</label><input class="input" type="date" id="rt" value="${RP.to}"></div><button class="btn btn-primary" id="rgo">Xem</button><button class="btn" id="xls" ${bad?'disabled':''}>${I.dl} Xuất Excel</button></div>`,
    bad?`<div class="card empty">Ngày bắt đầu phải trước ngày kết thúc.</div>`:`
    <section class="stats" style="grid-template-columns:repeat(5,1fr)">
      <div class="card stat"><div class="l">Doanh thu</div><div class="v">${(total/1e6).toFixed(1).replace('.',',')} tr</div><div class="d">Đã gồm VAT</div></div>
      <div class="card stat"><div class="l">Hội viên đang hoạt động</div><div class="v">412</div><div class="d">+38 hội viên mới</div></div>
      <div class="card stat"><div class="l">Gói đang chạy</div><div class="v">340</div><div class="d">Gói tập, không gồm vé ngày</div></div>
      <div class="card stat"><div class="l">Hoa hồng PT</div><div class="v">${(commTotal/1e6).toFixed(1).replace('.',',')} tr</div><div class="d">Theo % riêng từng PT</div></div>
      <div class="card stat"><div class="l">Vé 1 ngày</div><div class="v">186</div><div class="d">lượt · 11,2 tr doanh thu</div></div>
    </section>
    <div class="card pad" style="margin-bottom:16px"><h2>Doanh thu theo ngày</h2><p class="sub">Triệu đồng, đã gồm VAT</p>${svg}</div>
    <div class="grid-half" style="align-items:start">
      <div class="card"><div class="card-head"><h2>Doanh thu theo gói</h2></div><div class="table-wrap"><table><thead><tr><th>Gói</th><th class="r">Số đơn</th><th class="r">Doanh thu</th><th class="r">VAT ${vat}%</th></tr></thead><tbody>
        ${pk.map(p=>`<tr><td>${p[0]}</td><td class="r num">${p[1]}</td><td class="r num">${vnd(p[2])}</td><td class="r num muted">${vnd(p[2]-p[2]/(1+vat/100))}</td></tr>`).join('')}</tbody></table></div></div>
      <div class="card"><div class="card-head"><h2>Hoa hồng PT</h2></div><div class="table-wrap"><table><thead><tr><th>PT</th><th class="r">Hoàn thành</th><th class="r">Vắng</th><th class="r">Hủy</th><th class="r">Hoa hồng</th></tr></thead><tbody>
        ${pts.map(p=>{const n=p[2]+p[3]+p[4]+p[5];return `<tr><td>${p[0]} <span class="muted">(${p[1]}%)</span></td><td class="r num">${p[2]}</td><td class="r num">${p[3]}</td><td class="r num">${p[4]+p[5]}</td><td class="r num"><b>${vnd(commOf(p))}</b></td></tr>`}).join('')}</tbody></table></div>
        <p class="muted" style="font-size:12px;margin:0;padding:12px 16px;border-top:1px solid var(--border)">Hoa hồng vẫn tính cho buổi khách vắng, khách tự hủy và buổi PT hủy.</p></div>
    </div>`));
  $('#rgo').onclick=()=>{RP.from=val('rf');RP.to=val('rt');viewReport()};
  const x=$('#xls');if(x)x.onclick=()=>{const f=d=>d.split('-').reverse().join('-');
    const r=[['DOANH THU THEO GÓI','','',''],['Gói','Số đơn','Doanh thu (gồm VAT)','VAT '+vat+'%'],...pk.map(p=>[p[0],p[1],p[2],Math.round(p[2]-p[2]/(1+vat/100))]),['Tổng','',total,''],['','','',''],
      ['HOA HỒNG PT','','',''],['PT','% hoa hồng','Hoàn thành','Vắng','Hủy','Hoa hồng'],...pts.map(p=>[p[0],p[1],p[2],p[3],p[4]+p[5],commOf(p)]),['Tổng','','','','',commTotal]];
    exportCSV(`bao-cao_${f(RP.from)}_den_${f(RP.to)}.csv`,[`Báo cáo ${f(RP.from)} đến ${f(RP.to)}`,'','',''],r)};
}

startApp([
 [/^#\/signin$/,viewSignIn],[/^#\/settings$/,viewSettings],
 [/^#\/params$/,viewParams],[/^#\/params\/(\w+)$/,viewParam],[/^#\/hours$/,viewHours],
 [/^#\/packages$/,viewPackages],[/^#\/packages\/([\w-]+)$/,viewPackage],[/^#\/ptpackages$/,viewPtPackages],[/^#\/ptpackages\/([\w-]+)$/,viewPtPackage],

 [/^#\/staff$/,viewStaff],[/^#\/staff\/([\w-]+)$/,viewStaffOne],[/^#\/leaves$/,viewLeaves],[/^#\/leaves\/([\w-]+)$/,viewLeave],
 [/^#\/customers$/,viewCustomers],[/^#\/customers\/([\w-]+)$/,viewCustomer],
 [/^#\/transactions$/,viewTx],[/^#\/facility$/,viewFacility],[/^#\/facility\/([\w-]+)$/,viewFacilityOne],
 [/^#\/maintenance$/,viewMaint],[/^#\/maintenance\/([\w-]+)$/,viewMaintOne],[/^#\/feedback$/,viewFeedback],
 [/^#\/blog$/,viewBlog],[/^#\/blog\/(\w+)$/,viewEditor],[/^#\/notify$/,viewNotify],[/^#\/report$/,viewReport],
]);

</script>
