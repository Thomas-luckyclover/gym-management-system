      </div>
    </aside>
    <button class="cust-handle" type="button" id="dockHandle"
            aria-label="Mở menu điều hướng" aria-expanded="false" aria-controls="custDock">
      <i class="fa-solid fa-chevron-right"></i>
    </button>
  </div>

  <div class="cust-main">
    <header class="cust-topbar">
      <div>
        <h1>Thư viện bài tập</h1>
      </div>
      <div class="cust-topbar-actions">
        <a class="cust-user" href="tai-khoan.html" title="Cài đặt tài khoản">
          <span class="avatar">HL</span>
          <span class="cust-user-text">
            <b>Hoàng Long</b>
            <span>PT · NV-0118</span>
          </span>
        </a>
      </div>
    </header>

    <main class="cust-content">
      <div id="exMain">
        <p class="muted" id="exSummary"></p>
        <div class="toolbar">
          <div class="search">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input id="exQuery" type="search" maxlength="50" placeholder="squat, bench press…" aria-label="Tên bài (tiếng Anh)">
          </div>
          <label for="exEquip">Dụng cụ</label>
          <select id="exEquip"><option value="">Tất cả</option></select>
          <label for="exSort">Sắp xếp</label>
          <select id="exSort">
            <option value="name">Tên A → Z</option>
            <option value="-name">Tên Z → A</option>
          </select>
          <button class="btn btn-primary btn-sm" type="button" id="exApply">Lọc</button>
          <button class="btn btn-ghost btn-sm reset" type="button" id="exReset">Xóa lọc</button>
        </div>
        <div class="row-meta" id="exChips" aria-label="Lọc theo nhóm cơ"></div>
        <div class="data-list" id="exList"></div>
        <div class="empty-state" id="exEmpty" hidden>
          <div class="empty-icon"><i class="fa-solid fa-box-open"></i></div>
          <p>Không tìm thấy bài nào. Thử bỏ bớt bộ lọc.</p>
        </div>
        <div class="pager" data-pager>
          <div class="pager-info"></div>
          <div class="pager-btns"></div>
        </div>
      </div>
    
    </main>
  </div>
