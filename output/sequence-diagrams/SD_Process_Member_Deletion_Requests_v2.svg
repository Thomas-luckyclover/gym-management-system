<path d="M435,3207 H160" stroke="#334155" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="297.5" y="3165" text-anchor="middle" font-size="12"  stroke="white" stroke-width="4" paint-order="stroke">
<tspan x="297.5" dy="0">Redirect</tspan>
<tspan x="297.5" dy="16">/manager/members?tab=pending-deletions;</tspan>
<tspan x="297.5" dy="16">success toast</tspan>
</text>
<rect x="156" y="3207" width="8" height="22" fill="white" stroke="#334155"/>
<rect x="80" y="3255" width="1810" height="58" fill="#fff7d6" stroke="#c9a227"/>
<text x="92" y="3274" text-anchor="start" font-size="12"  stroke="white" stroke-width="4" paint-order="stroke">
<tspan x="92" dy="0">Failure branches do not continue into the success messages: rollback where a transaction is open; return ServiceResult.fail/failField. Controller preserves rejectReason and errors, then reloads the review page. No session invalidation on rejection or</tspan>
<tspan x="92" dy="16">rollback.</tspan>
</text>
