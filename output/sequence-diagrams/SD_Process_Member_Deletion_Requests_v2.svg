<text x="1122.5" y="2080" text-anchor="middle" font-size="12"  stroke="white" stroke-width="4" paint-order="stroke">
<tspan x="1122.5" dy="0">notifyEmployeeInTransaction(conn, requestedByEmployeeId, title, content)</tspan>
</text>
