<rect x="80" y="1863" width="1810" height="58" fill="#fff7d6" stroke="#c9a227"/>
<text x="92" y="1882" text-anchor="start" font-size="12"  stroke="white" stroke-width="4" paint-order="stroke">
<tspan x="92" dy="0">deactivateCustomer also calls PersonDAO.releasePersonContactIfNoActiveRoles(...) and AccountDAO.deactivateAccountIfNoActiveRoles(...), then finds the account ID. Keep contact/account active while another active role remains. Preserve orders, packages,</tspan>
<tspan x="92" dy="16">check-ins and sessions.</tspan>
</text>
